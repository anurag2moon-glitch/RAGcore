[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "ragcore"
version = "0.1.0"
description = "Reusable retrieval layer for RAG: structure-aware ingestion, swappable embedder/vector store, GraphRAG-ready."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
dependencies = [
    "tiktoken>=0.7",
]

[project.optional-dependencies]
pdf = ["pymupdf>=1.24"]
epub = ["ebooklib>=0.18", "selectolax>=0.3"]
docx = ["python-docx>=1.1"]
voyage = ["voyageai>=0.3"]
lancedb = ["lancedb>=0.13", "pyarrow>=16"]
all = [
    "pymupdf>=1.24",
    "ebooklib>=0.18",
    "selectolax>=0.3",
    "python-docx>=1.1",
    "voyageai>=0.3",
    "lancedb>=0.13",
    "pyarrow>=16",
]
dev = ["pytest>=8", "pytest-cov>=5"]

[tool.hatch.build.targets.wheel]
packages = ["ragcore"]

[tool.pytest.ini_options]
markers = [
    "live: hits real external services (network, API keys required); excluded by default",
]
addopts = "-m 'not live'"
