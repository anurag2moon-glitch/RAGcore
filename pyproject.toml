[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "ragcore"
version = "0.1.0"
description = "Reusable retrieval layer for RAG: structure-aware ingestion, swappable embedder/vector store, GraphRAG-ready."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
dependencies = [
    "tiktoken>=0.7",
]

[project.optional-dependencies]
pdf = ["pymupdf>=1.24"]
epub = ["ebooklib>=0.18", "selectolax>=0.3"]
docx = ["python-docx>=1.1"]
voyage = ["voyageai>=0.3"]
lancedb = ["lancedb>=0.13", "pyarrow>=16"]
generation = ["anthropic>=1.0", "pydantic>=2"]
concepts = ["networkx>=3"]
all = [
    "pymupdf>=1.24",
    "ebooklib>=0.18",
    "selectolax>=0.3",
    "python-docx>=1.1",
    "voyageai>=0.3",
    "lancedb>=0.13",
    "pyarrow>=16",
    "anthropic>=1.0",
    "pydantic>=2",
    "networkx>=3",
]
dev = ["pytest>=8", "pytest-cov>=5"]

[tool.hatch.build.targets.wheel]
packages = ["ragcore"]

[tool.pytest.ini_options]
markers = [
    "live: hits real external services (network, API keys required); excluded by default",
    "integration: production-scale integration suite (tests/integration) - no network, real components, deterministic mock embedder/extractor",
    "gutenberg: real Project Gutenberg books read from a local opt-in cache (see scripts/fetch_gutenberg.py); excluded by default, skips cleanly when the cache is absent",
]
addopts = "-m 'not live and not gutenberg'"
