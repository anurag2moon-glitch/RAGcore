[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "ragcore-server"
version = "0.1.0"
description = "Reference FastAPI server exposing a single ragcore.Corpus over HTTP. See docs/adr/0008-api-server-as-sibling-package.md."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
dependencies = [
    "fastapi[opentelemetry]>=0.142",
    "uvicorn>=0.29",
    "python-multipart>=0.0.9",
    "pydantic-settings>=2.6",
    "psycopg[binary]>=3.1",
    "alembic>=1.13",
    "rq>=1.16",
    "redis>=5.0",
    "boto3>=1.34",
]
# ragcore itself is a sibling-package dependency, not declared here: a
# relative `file://../` direct reference isn't portable across pip's
# URL handling on every platform (confirmed directly: pip rejects it as
# a "non-local file URI" even though it resolves to a local path).
# Install both in one venv with: pip install -e .. -e ".[dev]"
#
# psycopg/alembic/rq/redis/boto3 are this server's own choice of driver
# for Postgres/the async ingest job queue/MinIO respectively (ADR 0014) -
# psycopg specifically reuses ragcore[postgres]'s own driver choice
# rather than introducing a second Postgres driver.
#
# fastapi[opentelemetry] (the deployment request's own ask: "OpenTelemetry
# tracing wired to a local collector in Compose") - FastAPI 0.142+ ships
# native OpenTelemetry integration (FastAPI(telemetry={...}), defaulting
# to on even when the kwarg is omitted entirely - confirmed directly,
# not assumed from the changelog) that auto-configures an OTLP http/
# protobuf exporter from OTEL_EXPORTER_OTLP_ENDPOINT when this extra's
# packages (opentelemetry-sdk + the OTLP exporter) are installed; the
# >=0.142 floor is pinned specifically because this feature doesn't
# exist in the >=0.110 floor this dependency previously had - installing
# an older 0.110.x would silently have no telemetry() kwarg at all.

[project.optional-dependencies]
dev = ["pytest>=8", "httpx>=0.27", "moto[s3]>=5", "fakeredis>=2.20", "mypy>=1.10"]

[tool.hatch.build.targets.wheel]
packages = ["app"]

[tool.pytest.ini_options]
pythonpath = ["."]
markers = [
    "postgres: hits a real Postgres server via RAGCORE_TEST_POSTGRES_URL; excluded by default, skips cleanly when that env var is unset",
]
addopts = "-m 'not postgres'"

[tool.mypy]
# app/ and scripts/ are both zero-finding as of this config's
# introduction (confirmed directly, not assumed) - this is a genuine
# CI gate (ci.yml's test-server job), not report-only like the
# repo-wide ruff step, specifically because there's no backlog to
# excuse deferring it. explicit_package_bases: scripts/ has no
# __init__.py (a namespace package, matching how it's imported
# elsewhere - see tests/test_backup_restore.py), which mypy otherwise
# refuses to check alongside app/ ("Source file found twice under
# different module names").
explicit_package_bases = true
ignore_missing_imports = true
