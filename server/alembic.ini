[alembic]
script_location = alembic
# Deliberately no sqlalchemy.url here - app/alembic_env.py (via env.py)
# reads DATABASE_URL from app.settings.get_settings() instead, so the
# connection string is validated through the same Settings model
# everything else in this server uses, not duplicated into a second
# config file.

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARNING
handlers = console
qualname =

[logger_sqlalchemy]
level = WARNING
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
