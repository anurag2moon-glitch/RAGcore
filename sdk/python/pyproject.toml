[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "ragcore-client"
version = "0.1.0"
description = "Python client SDK for the ragcore reference server (server/). See docs/adr/0008-api-server-as-sibling-package.md."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
dependencies = [
    "httpx>=0.27",
]

[project.optional-dependencies]
dev = ["pytest>=8", "fastapi>=0.110", "uvicorn>=0.29", "python-multipart>=0.0.9"]
# fastapi/uvicorn here are test-only: tests exercise this client against
# the real server/ FastAPI app object in-process via httpx's
# ASGITransport, not a real network call — see tests/test_client.py.
# They are never required to use this client against a real server.

[tool.hatch.build.targets.wheel]
packages = ["ragcore_client"]

[tool.pytest.ini_options]
pythonpath = ["."]
